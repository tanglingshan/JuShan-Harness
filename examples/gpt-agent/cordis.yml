# GPT-powered coding agent with OpenAI models
# This configuration uses the pi-ai adapter to connect to OpenAI's API
# API keys are loaded from the root `.env` file into the process environment

# User-settings document (`$DSH_HOME/settings.yaml`, hot-reloaded)
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# Credential store: the live process environment over `$DSH_HOME/.credentials.yaml`
# The adapter resolves `OPENAI_API_KEY` through it at each request
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# Pi-AI adapter for OpenAI (configured via settings.yaml)
# The models are defined in $DSH_HOME/settings.yaml under llm-pi-ai.providers.openai
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'

# Managed child-process groups for the bash executor
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    timeoutMs: 60000

# The agent configuration using OpenAI GPT-5.4
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: openai           # Use OpenAI provider
        model: gpt-5.4             # Use GPT-5.4 model (注意是点号)
        cwd: !!js process.cwd()
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are a GPT-5 powered coding assistant using the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# Summarize an older range when derived history approaches the context window
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# Projection registry for subagent identity
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

# Subagent providers
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

# Workflow engine
- id: workflow-worker-thread
  name: '@deepseek-ai/dsh-workflow-worker-thread'
  config:
    provider: spawn

- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'

- id: tool-ralph
  name: '@deepseek-ai/dsh-tool-ralph'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Filesystem tools
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

# 沙箱配置
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

# 审批策略
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
